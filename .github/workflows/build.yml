name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "diya-monitor-${VERSION}.apk"
          ls -l diya-monitor-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diya-monitor-apk
          path: diya-monitor-*.apk
          if-no-files-found: error

      # The in-app updater shows these notes as "What's new".
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log --no-merges --format='- %s' "${PREV:+$PREV..}${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: diya-monitor-*.apk
          body_path: release-notes.md
